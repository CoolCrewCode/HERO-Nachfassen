[build]
  functions = "netlify/functions"

# Läuft täglich um 07:00 UTC (= 08:00/09:00 Uhr deutscher Zeit, je nach Sommer-/Winterzeit).
# Cron läuft immer in UTC – bei Bedarf anpassen: https://docs.netlify.com/build/functions/scheduled-functions/
[functions."hero-offer-followup"]
  schedule = "0 7 * * *"

# Empfehlungsprogramm: täglich um 08:00 UTC (zeitversetzt zum Nachfass-Job, damit nicht alles
# gleichzeitig auf HERO zugreift).
[functions."hero-referral-code-mailer"]
  schedule = "0 8 * * *"

# Kurzer, aufgeräumter Link für die Empfehlungs-Landingpage statt der technischen
# .netlify/functions/...-URL – leichter zu lesen, kopieren und per WhatsApp o.ä. weiterzuleiten.
# Ergebnis: https://<site>/empfehlung?code=KK-1234
[[redirects]]
  from = "/empfehlung"
  to = "/.netlify/functions/hero-referral-landing"
  status = 200
